name: PR quality

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Syntax, tests, and frozen benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: assumption-radar

    steps:
      - name: Check out pull request
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: assumption-radar/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run test suite
        run: npm test

      - name: Run frozen performance benchmark
        run: npm run perf:daily

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-performance-${{ github.run_id }}
          path: assumption-radar/.cache/performance-runs/
          if-no-files-found: ignore
          retention-days: 14
